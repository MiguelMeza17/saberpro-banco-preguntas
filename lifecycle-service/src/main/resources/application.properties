spring.application.name=lifecycle-service
server.port=8084

# RabbitMQ: localhost en ejecucion local; en Docker Compose SPRING_RABBITMQ_HOST=rabbitmq
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

