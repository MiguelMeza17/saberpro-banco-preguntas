spring.application.name=question-service
server.port=8083

# H2 en memoria para ejecucion local; en Docker se reemplaza por variables de entorno
spring.datasource.url=jdbc:h2:mem:saberprodb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# URL de validation-service (REST sincrono); en Docker Compose: http://validation-service:8082
saberpro.validation.url=${SABERPRO_VALIDATION_URL:http://localhost:8082}

# Adaptador de persistencia: jpa (por defecto) o memoria
saberpro.persistencia=${SABERPRO_PERSISTENCIA:jpa}

# RabbitMQ: localhost en ejecucion local; en Docker Compose SPRING_RABBITMQ_HOST=rabbitmq
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Reintentos al publicar: cubre el arranque de RabbitMQ (healthy antes de aceptar conexiones AMQP)
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-attempts=4
spring.rabbitmq.template.retry.initial-interval=500ms
spring.rabbitmq.template.retry.multiplier=2
